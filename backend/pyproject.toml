[project]
name = "ai-content-factory-backend"
version = "0.1.0"
description = "API and orchestration boundary for AI Content Factory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
