name: Release Android

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK and AAB
    runs-on: ubuntu-24.04
    environment:
      name: production

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          TAG_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${TAG_REF#refs/tags/}}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: $TAG"
            exit 1
          }
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Calculate Android versionCode
        id: version
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          (( VERSION_CODE <= 2147483647 )) || {
            echo "Generated versionCode is too large."
            exit 1
          }
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION"
          echo "versionCode=$VERSION_CODE"

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}" || {
            echo "ANDROID_KEYSTORE_BASE64 is not configured in production environment."
            exit 1
          }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH"             -storepass "${{ secrets.STORE_PASSWORD }}"             -alias upload >/dev/null
          echo "Release keystore and alias upload verified."

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_PASSWORD:-}"
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          test -s "$AAB"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          keytool -printcert -jarfile "$APK" >/dev/null
          echo "APK and AAB verified."

      - name: Prepare release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/app-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/app-${VERSION}.aab"
          (
            cd release
            sha256sum "app-${VERSION}.apk" "app-${VERSION}.aab" > SHA256SUMS.txt
          )
          printf 'tag=%s\nversionName=%s\nversionCode=%s\ncommit=%s\n'             "$TAG" "$VERSION" "$VERSION_CODE" "$(git rev-parse HEAD)" > release/BUILD_PROVENANCE.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.release.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG"             release/app-${VERSION}.apk             release/app-${VERSION}.aab             release/SHA256SUMS.txt             release/BUILD_PROVENANCE.txt             --title "AI Content Factory $TAG"             --generate-notes

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"
