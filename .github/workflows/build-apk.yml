name: Build APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Generate CI release keystore
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.keystore \
            -storepass ci-release-password \
            -alias upload \
            -keypass ci-release-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=AI Content Factory CI,O=AI Content Factory,C=US"
      - name: Build optimized APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.keystore
          STORE_PASSWORD: ci-release-password
          KEY_PASSWORD: ci-release-password
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AI-Content-Factory.apk
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AI-Content-Factory.apk
          name: AI Content Factory ${{ github.ref_name }}
          generate_release_notes: true
