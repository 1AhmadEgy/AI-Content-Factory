name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_NAME: AI-Content-Factory.apk

jobs:
  build:
    name: Lint, test and build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle wrapper and modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties', 'settings.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare CI release signing key
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.jks \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=AI Content Factory, OU=CI, O=AI Content Factory, L=Tripoli, ST=Tripoli, C=LY"
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/ci-release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Run Kotlin/Android lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew test

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          file app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Factory-APK
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Create or update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          target_commitish: ${{ github.sha }}
          prerelease: false
          draft: false
          files: dist/${{ env.APK_NAME }}
          body: |
            Automated CI build from GitHub Actions.
            - APK: AI-Content-Factory.apk
            - Branch: main
            - Signing: ephemeral CI key (not a production signing key)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
