name: Security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [python, java-kotlin]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java for Kotlin/Android analysis
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle for Kotlin/Android analysis
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4
        with
          gradle-version: "9.3.1"

      - name: Set up Android SDK for Kotlin/Android analysis
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 for Kotlin/Android analysis
        if: matrix.language == 'java-kotlin'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'autobuild' || 'none' }}
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Audit dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
