name: Android Google Play Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

env:
  GRADLE_VERSION: "9.3.1"
  AAB_PATH: app/build/outputs/bundle/release/app-release.aab

jobs:
  play-bundle:
    name: Build and verify Play upload bundle
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Require production upload-key secrets
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > ci-release.jks
          test -s ci-release.jks
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/ci-release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Check upload key certificate
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore ci-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | grep -E "Alias name:|Entry type:|Certificate fingerprints:|SHA256:" \
            | sed -E 's/^[[:space:]]+//' \
            | head -n 20

      - name: Run Android lint
        run: gradle lint --no-daemon

      - name: Run unit tests
        run: gradle test --no-daemon

      - name: Build release AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Verify release AAB exists
        run: |
          set -euo pipefail
          test -s "${AAB_PATH}"
          file "${AAB_PATH}"
          ls -lh "${AAB_PATH}"

      - name: Verify AAB signature
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs "${AAB_PATH}" > aab-signature.txt
          grep -q "jar verified" aab-signature.txt
          grep -E "X.509|CN=|SHA256:" aab-signature.txt | head -n 20 || true

      - name: Verify package and version metadata
        run: |
          set -euo pipefail
          unzip -p "${AAB_PATH}" BUNDLE-METADATA/com.android.tools.build.libraries/dependencies.pb >/dev/null 2>&1 || true
          echo "Release bundle built successfully. Google Play App Signing will sign the distributed APKs after upload when Play App Signing is enabled."

      - name: Upload Play-ready AAB
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Factory-Play-AAB
          path: |
            ${{ env.AAB_PATH }}
            aab-signature.txt
          if-no-files-found: error
          retention-days: 30
