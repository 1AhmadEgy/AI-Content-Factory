name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: AI-Content-Factory.apk

jobs:
  build:
    name: Lint, test, release build and verify APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Prepare CI release signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore ci-release.jks \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=AI Content Factory, OU=CI, O=AI Content Factory, L=Tripoli, ST=Tripoli, C=LY"
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/ci-release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Run Android lint
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Run JVM/Robolectric unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          file "$APK"
          apksigner verify --verbose "$APK"
          sha256sum "$APK"
          echo "Built commit: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Prepare verified APK artifact
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/${APK_NAME}"
          printf 'commit=%s\nsha256=' "$(git rev-parse HEAD)" > release/BUILD_PROVENANCE.txt
          sha256sum "release/${APK_NAME}" | cut -d' ' -f1 >> release/BUILD_PROVENANCE.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Factory-APK-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Delete previous latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Create latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest \
            "release/${APK_NAME}" \
            --title "AI Content Factory - Latest APK" \
            --notes "Automated APK from commit ${GITHUB_SHA}. CI passed lint, JVM/Robolectric tests, release build and apksigner verification." \
            --prerelease
