name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: AI-Content-Factory.apk

jobs:
  build:
    name: Lint, test and build CI APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        run: ./gradlew --version

      - name: Prepare CI release signing key
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass android \
            -keypass android \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=AI Content Factory, OU=CI, O=AI Content Factory, L=Tripoli, ST=Tripoli, C=LY"
          chmod 600 "$RUNNER_TEMP/ci-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"

      - name: Run Android lint
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build CI APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          test -s "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/${APK_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Content-Factory-APK
          path: release/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
