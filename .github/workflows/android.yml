name: Android Build and Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK and release validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle project
        run: gradle --no-daemon tasks --stacktrace

      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Build unsigned release APK for validation
        run: gradle --no-daemon :app:assembleRelease --stacktrace
        env:
          STORE_PASSWORD: ""
          KEY_PASSWORD: ""

      - name: Validate APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          file app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t app/build/outputs/apk/release/app-release-unsigned.apk >/dev/null

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-content-factory-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
