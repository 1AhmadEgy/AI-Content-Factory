name: Android Build and Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK/AAB build, tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle project
        run: gradle --no-daemon tasks --stacktrace

      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Build release APK and AAB with ephemeral CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-upload-key.jks" \
            -storepass ci-password \
            -keypass ci-password \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AI Content Factory CI,O=CI,C=US"
          gradle --no-daemon :app:assembleRelease :app:bundleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-upload-key.jks
          STORE_PASSWORD: ci-password
          KEY_PASSWORD: ci-password

      - name: Validate Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab; do
            test -s "$artifact"
            file "$artifact"
          done
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          unzip -t app/build/outputs/bundle/release/app-release.aab >/dev/null
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-content-factory-android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
