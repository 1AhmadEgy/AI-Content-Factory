name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install media runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Verify imports
        run: python -c "import backend.app.main; import app.main"
      - name: Verify API routes
        run: python -c "from fastapi.testclient import TestClient; from backend.app.main import app; paths = [getattr(route, 'path', '<included-router>') for route in app.routes]; print('health route:', '/api/v1/health' in paths); print('readiness route:', '/api/v1/readiness' in paths); print('health status:', TestClient(app).get('/api/v1/health').status_code); print('readiness status:', TestClient(app).get('/api/v1/readiness').status_code); print('route types:', [type(route).__name__ for route in app.routes]); print('module:', app.__class__.__module__)"
      - name: Run tests
        run: python -m pytest -q
