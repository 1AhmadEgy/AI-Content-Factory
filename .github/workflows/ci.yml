name: CI and Publish

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Build assets and test backend
    runs-on: ubuntu-24.04
    env:
      AICF_API_KEY: test-aicf-key
      AICF_TEST_MODE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape ffmpeg

      - name: Build brand and video assets
        run: |
          chmod +x build_brand_assets.sh build_video_assets.sh
          ./build_brand_assets.sh
          ./build_video_assets.sh

      - name: Validate canonical Afham Wadhak brand
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("backend/app/config/brands/afham_wadhak.json")
          c = json.loads(p.read_text(encoding="utf-8"))

          assert c["brand_id"] == "afham_wadhak"
          assert c["brand_name_ar"] == "افهم واضحك"
          assert c["brand_name_en"] == "Afham Wadhak"
          assert c["tagline_ar"] == "افهم ببساطة وابتسم"
          assert c["color_palette"]["secondary"] == "#FFD84D"
          assert c["color_palette"]["accent"] == "#4DB6FF"
          assert c["watermark"]["position"] == "bottom_right"

          print("Afham Wadhak brand configuration: OK")
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Validate Python syntax
        run: python -m compileall -q backend/app backend/tests

      - name: Run Ruff lint
        working-directory: backend
        run: ruff check --output-format=github .

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

      - name: Verify generated asset layout
        run: |
          set -euo pipefail
          test -d assets/branding/afham_wadhak
          test -n "$(find assets/branding/afham_wadhak -type f -print -quit)"

      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: afham-wadhak-assets
          path: assets/branding/afham_wadhak/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android CI
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Android unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-24.04
    needs:
      - test
      - android
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated assets
        uses: actions/download-artifact@v4
        with:
          name: afham-wadhak-assets
          path: assets/branding/afham_wadhak/

      - name: Verify generated assets
        run: |
          test -d assets/branding/afham_wadhak/
          test -n "$(find assets/branding/afham_wadhak/ -type f -print -quit)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=AI Content Factory
            org.opencontainers.image.description=AI Content Factory Backend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
