name: Unzip uploaded fixes

on:
  push:
    paths:
      - 'uploads/*.zip'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: unzip-uploaded-fixes
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify uploaded ZIP from triggering commit
        id: zip
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mapfile -t zips < <(find uploads -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
          else
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              mapfile -t zips < <(git ls-tree -r --name-only "$AFTER_SHA" -- 'uploads/*.zip')
            else
              mapfile -t zips < <(git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA" -- 'uploads/*.zip')
            fi
          fi
          if [ ${#zips[@]} -eq 0 ]; then
            echo 'No triggering ZIP found in uploads/.' >&2
            exit 1
          fi
          if [ ${#zips[@]} -gt 1 ]; then
            echo 'More than one ZIP was introduced or changed by the triggering revision; refusing to guess.' >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          ZIP_FILE="${zips[0]}"
          [[ -f "$ZIP_FILE" ]] || { echo "ZIP does not exist: $ZIP_FILE" >&2; exit 1; }
          echo "path=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate and extract ZIP
        if: steps.zip.outputs.path != ''
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="${{ steps.zip.outputs.path }}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q -t "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$TMP/raw"
          ROOT="$TMP/raw"
          entries=("$ROOT"/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then ROOT="${entries[0]}"; fi
          if find "$ROOT" -type l -print -quit | grep -q .; then
            echo 'ZIP contains symbolic links; refusing extraction.' >&2
            exit 1
          fi
          find "$ROOT" -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +
          find "$ROOT" -type f \( -name '*.pyc' -o -name 'debug.keystore' \) -delete
          rm -rf "$ROOT/.git"
          rsync -a --exclude 'uploads/' "$ROOT/" ./
          rm -f "$ZIP_FILE"

      - name: Commit extracted project to review branch
        id: commit
        if: steps.zip.outputs.path != ''
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BRANCH="automation/upload-import-${RUN_ID}-${RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No extracted changes to commit.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore: import uploaded AI-Content-Factory snapshot'
          git push --set-upstream origin "$BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request for imported snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_BRANCH: ${{ steps.commit.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create --base main --head "$IMPORT_BRANCH" --draft --title 'chore: review uploaded AI-Content-Factory snapshot' --body 'Automated import of an uploaded project snapshot. This workflow intentionally does not push extracted files directly to main. CI and human review must complete before merge.'
